name: Lighthouse Audit

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit'
        required: true
        type: string
      callback_url:
        description: 'URL to POST results to'
        required: true
        type: string
      audit_id:
        description: 'Unique audit ID for correlation'
        required: true
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      AUDIT_URL: ${{ inputs.url }}
      CALLBACK_URL: ${{ inputs.callback_url }}
      AUDIT_ID: ${{ inputs.audit_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lighthouse
        run: npm install -g lighthouse@12.8.2

      - name: Run Lighthouse
        id: lighthouse
        continue-on-error: true
        run: |
          lighthouse "$AUDIT_URL" \
            --output=json \
            --output-path=./lhr.json \
            --chrome-flags="--headless --no-sandbox --disable-gpu --no-first-run" \
            --quiet || echo "Lighthouse exited with error"

      - name: Send results to callback
        if: always()
        env:
          AUDIT_SECRET: ${{ secrets.AUDIT_CALLBACK_SECRET }}
        run: |
          if [ -f ./lhr.json ]; then
            result_file=./lhr.json
          else
            result_file=./audit-error.json
            printf '%s' '{"error":"Lighthouse failed to produce output"}' > "$result_file"
          fi
          curl --fail-with-body --silent --show-error -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-audit-id: $AUDIT_ID" \
            -H "x-audit-secret: $AUDIT_SECRET" \
            --data-binary "@$result_file" \
            --connect-timeout 10 \
            --max-time 30
